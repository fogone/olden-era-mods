# Publishes the mods' SDK (Nobirds.OldenEra.Modding.Sdk) to nuget.org, run by hand after publish-sdk.ps1 made its GitHub
# release sdk-v<version> with the .nupkg (it is built where the game is: the library inside builds against the game's
# files, which a runner does not have). nuget.org trusts this workflow (Trusted Publishing: owner fogone, repository
# olden-era-mods, workflow file publish-sdk.yml) and gives it a key for an hour; no key is stored anywhere.
#   gh workflow run publish-sdk.yml -f tag=sdk-v0.1.0
name: publish-sdk
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The SDK's GitHub release (sdk-v<version>) holding the .nupkg"
        required: true
permissions:
  contents: read
jobs:
  nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token nuget.org exchanges for a short-lived key
    steps:
      - name: The package from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in sdk-v*) ;; *) echo "not an SDK release: $TAG"; exit 1 ;; esac
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Nobirds.OldenEra.Modding.Sdk.*.nupkg' --dir package
          ls -l package
      - name: A short-lived key from nuget.org
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push package/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
